name: update check

on:
  push:
    paths:
      - .github/workflows/update-check.yaml
      - update-check.py
  pull_request:
    paths:
      - .github/workflows/update-check.yaml
      - update-check.py
  schedule:
    - cron: '0 0 * * *'  # runs everyday at midnight
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && github.event.repository.default_branch || github.ref }}

      - name: Check Update
        id: check
        run: python3 update-check.py ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != format('refs/heads/{0}', github.event.repository.default_branch)) }}

      - name: Dispatch image publish workflows
        if: steps.check.outputs.changed == 'true' && (github.event_name == 'schedule' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/dispatches" \
            --method POST \
            -f event_type=proton_bridge_updated \
            -f "client_payload[version]=${{ steps.check.outputs.version }}"
