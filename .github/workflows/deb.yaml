name: pack from deb

on:
  push:
    paths:
      - .github/workflows/deb.yaml
      - deb/*
      - VERSION
  pull_request: {}
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

env:
  GHCR_REPO: ghcr.io/${{ github.repository }}

jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_ENV"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_REPO }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for scan
        uses: docker/build-push-action@v6
        with:
          context: ./deb
          file: ./deb/Dockerfile
          labels: ${{ steps.meta.outputs.labels }}
          load: true
          tags: protonmail-bridge:scan
          build-args: |
            version=${{ env.version }}

      - name: Smoke test Bridge binary
        run: docker run --rm --entrypoint /usr/lib/protonmail/bridge/bridge protonmail-bridge:scan --version

      - name: Check Bridge shared libraries
        run: |
          docker run --rm --entrypoint sh protonmail-bridge:scan -ec '
            ldd /usr/lib/protonmail/bridge/bridge | tee /tmp/bridge-ldd.txt
            ! grep -q "not found" /tmp/bridge-ldd.txt
          '

      - name: Run blocking Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: protonmail-bridge:scan
          scanners: 'vuln'
          format: 'table'
          exit-code: 1
          severity: 'CRITICAL'

      - name: Generate Trivy SARIF report
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: protonmail-bridge:scan
          scanners: 'vuln'
          format: 'sarif'
          exit-code: 0
          severity: 'CRITICAL,HIGH'
          limit-severities-for-sarif: true
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan SARIF report
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Login to GHCR
        uses: docker/login-action@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish GHCR image
        uses: docker/build-push-action@v6
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        with:
          context: ./deb
          file: ./deb/Dockerfile
          labels: ${{ steps.meta.outputs.labels }}
          tags: |
            ${{ env.GHCR_REPO }}:latest
            ${{ env.GHCR_REPO }}:${{ env.version }}
          push: true
          provenance: false
          sbom: false
          build-args: |
            version=${{ env.version }}
